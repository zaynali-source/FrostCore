name: Build FrostCore

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: frostcore-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and root module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          printf '%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            > "$SDK_ROOT/licenses/android-sdk-license"
          printf '%s\n' '84831b9409646a918e30573bab4c9c91346d8abd' \
            > "$SDK_ROOT/licenses/android-sdk-preview-license"
          chmod -R a+rwX "$SDK_ROOT"

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -path '*/cmdline-tools/*/bin/*' | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          test -d "$ANDROID_HOME/platforms/android-35"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Package flashable root module
        shell: bash
        run: |
          set -euo pipefail
          test -f module/module.prop
          test -f module/service.sh
          test -f module/frostcore.sh
          mkdir -p dist
          (cd module && zip -qr ../dist/FrostCore-module.zip .)
          unzip -l dist/FrostCore-module.zip

      - name: Upload APK and module
        uses: actions/upload-artifact@v4
        with:
          name: FrostCore-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            dist/FrostCore-module.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FrostCore-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
